name: Evaluation correctness

on:
  pull_request:
    paths:
      - 'src/fijepa/**'
      - 'scripts/eval_v2.py'
      - 'scripts/train_recorded.py'
      - 'tests/**'
      - 'RESEARCH_STATE.json'
      - 'research/DEVELOPMENT_PAIRED_EVALUATION_20261010.md'
      - 'research/DEVELOPMENT_RECORDED_TRAINING_20261010.md'
      - '.github/workflows/evaluation-correctness.yml'
  push:
    branches: [main]
    paths:
      - 'src/fijepa/**'
      - 'scripts/eval_v2.py'
      - 'scripts/train_recorded.py'
      - 'tests/**'
      - 'RESEARCH_STATE.json'
      - 'research/DEVELOPMENT_PAIRED_EVALUATION_20261010.md'
      - 'research/DEVELOPMENT_RECORDED_TRAINING_20261010.md'
      - '.github/workflows/evaluation-correctness.yml'

permissions:
  contents: read

jobs:
  generated-regression-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind tests to the exact source
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Verify numerical metrics and real checkpoint execution
        run: python -m pytest -q tests
      - name: Check new evaluation code
        run: python -m ruff check --isolated --select E4,E7,E9,F,I src/fijepa/evaluation.py scripts/eval_v2.py tests/test_regression_metrics.py tests/test_latent_evaluation.py
      - name: Check recorded development training
        run: python -m ruff check --isolated --select E4,E7,E9,F,I src/fijepa/recorded_training.py scripts/train_recorded.py tests/test_recorded_training.py tests/test_recorded_process_group.py
