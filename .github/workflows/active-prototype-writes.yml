name: Active prototype write correctness

on:
  pull_request:
    paths:
      - 'src/fijepa/memory.py'
      - 'tests/test_active_prototype_writes.py'
      - 'scripts/demo_active_prototype_writes.py'
      - 'research/verification/active_prototype_writes_20261010/parent_memory.py'
      - '.github/workflows/active-prototype-writes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-write-correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source under test
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU development dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Generated prototype and actual model/optimizer controls
        run: >-
          python -m pytest -q tests/test_active_prototype_writes.py
          tests/test_gradient_accumulation.py tests/test_gradient_failure_atomicity.py
          tests/test_model_smoke.py tests/test_recorded_checkpoint_structure.py
