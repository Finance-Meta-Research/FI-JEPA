name: Optimizer correctness

on:
  pull_request:
    paths:
      - src/fijepa/trainer.py
      - tests/test_gradient_accumulation.py
      - .github/workflows/optimizer-correctness.yml
  push:
    branches: [main]
    paths:
      - src/fijepa/trainer.py
      - tests/test_gradient_accumulation.py
      - .github/workflows/optimizer-correctness.yml

permissions:
  contents: read

jobs:
  generated-regression-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify actual accumulated optimizer updates
        run: python -m pytest -q tests/test_gradient_accumulation.py tests/test_model_smoke.py tests/test_temporal_integrity.py tests/test_paper_protocol.py
