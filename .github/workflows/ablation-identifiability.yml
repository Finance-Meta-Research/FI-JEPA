name: FI-JEPA ablation identifiability audit

on:
  push:
    branches:
      - research/fijepa-paper-evidence-20260909
  pull_request:
    paths:
      - configs/benchmark_macro.yaml
      - src/fijepa/benchmark.py
      - src/fijepa/config.py
      - src/fijepa/model.py
      - scripts/check_ablation_identifiability.py
      - .github/workflows/ablation-identifiability.yml

permissions:
  contents: read

concurrency:
  group: fi-jepa-ablation-identifiability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  identify-real-ablations:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Bind audit to exact source
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "verified_source=$actual"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Compile audit
        run: python -m py_compile scripts/check_ablation_identifiability.py

      - name: Verify executed mechanism distinctions
        run: python scripts/check_ablation_identifiability.py
