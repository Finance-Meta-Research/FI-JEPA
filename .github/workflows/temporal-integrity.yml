name: Temporal Integrity

on:
  pull_request:
    paths:
      - 'src/fijepa/data.py'
      - 'tests/test_temporal_integrity.py'
      - 'tests/test_panel_calendar_integrity.py'
      - 'tests/test_normalizer_integrity.py'
      - '.github/workflows/temporal-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'src/fijepa/data.py'
      - 'tests/test_temporal_integrity.py'
      - 'tests/test_panel_calendar_integrity.py'
      - 'tests/test_normalizer_integrity.py'
      - '.github/workflows/temporal-integrity.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind tests to the exact source
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Temporal integrity tests
        run: python -m pytest tests/test_temporal_integrity.py tests/test_panel_calendar_integrity.py tests/test_normalizer_integrity.py -q
