name: Temporal Integrity

on:
  pull_request:
    paths:
      - 'src/fijepa/data.py'
      - 'tests/test_temporal_integrity.py'
      - '.github/workflows/temporal-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'src/fijepa/data.py'
      - 'tests/test_temporal_integrity.py'
      - '.github/workflows/temporal-integrity.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Temporal integrity tests
        run: python -m pytest tests/test_temporal_integrity.py -q
