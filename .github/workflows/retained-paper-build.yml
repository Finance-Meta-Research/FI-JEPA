name: Retained FI-JEPA paper build

on:
  pull_request:
    branches: [main]
    paths:
      - 'paper/**'
      - 'experiments/paper_results.json'
      - 'scripts/check_paper_evidence_gate.py'
      - 'scripts/make_canonical_paper_assets.py'
      - 'tests/test_paper_evidence_gate.py'
      - '.github/workflows/retained-paper-build.yml'
  push:
    branches: [main]
    paths:
      - 'paper/**'
      - 'experiments/paper_results.json'
      - 'scripts/check_paper_evidence_gate.py'
      - 'scripts/make_canonical_paper_assets.py'
      - 'tests/test_paper_evidence_gate.py'
      - '.github/workflows/retained-paper-build.yml'

permissions:
  contents: read

jobs:
  verify-and-build-saved-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact source identity
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install reporting dependencies only
        run: |
          python -m pip install 'numpy>=1.24,<3'
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-extra texlive-fonts-recommended poppler-utils
      - name: Verify saved arithmetic and deterministic generated assets
        run: |
          python scripts/check_paper_evidence_gate.py
          python -m unittest discover -s tests -p test_paper_evidence_gate.py -v
          python scripts/make_canonical_paper_assets.py
          git diff --exit-code -- paper/generated/canonical_results_table.tex paper/generated/canonical_results_summary.md
      - name: Compile retained manuscript
        working-directory: paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex
      - name: Reject clipping and unresolved references
        shell: bash
        run: |
          set -euo pipefail
          if grep -E 'Overfull \\(hbox|vbox)|LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|destination with the same identifier' paper/main.log; then
            echo 'Saved-evidence manuscript failed layout/reference checks.'
            exit 1
          fi
          test -s paper/main.pdf
          mkdir -p paper-build-evidence
          git rev-parse HEAD > paper-build-evidence/source-head.txt
          sha256sum experiments/paper_results.json scripts/make_canonical_paper_assets.py paper/main.tex paper/generated/canonical_results_table.tex paper/main.pdf > paper-build-evidence/sha256sums.txt
          cp paper/main.pdf paper/main.log paper-build-evidence/
      - name: Retain source-bound build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fijepa-saved-evidence-paper-${{ github.event.pull_request.head.sha || github.sha }}
          path: paper-build-evidence
          retention-days: 30
          if-no-files-found: error
